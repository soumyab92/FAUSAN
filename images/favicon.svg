<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8C7321" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Background with Gold Border Ring -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Monogram F Luxury Serif Glyph -->
  <path d="M160 120 H360 V175 H228 V240 H335 V295 H228 V392 H160 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Subtle Atelier Accent Diamond -->
  <polygon points="360,120 375,135 360,150 345,135" fill="#F3E5AB" />
</svg>
